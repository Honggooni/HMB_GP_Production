name: release-audit

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-release-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.release_metadata.outputs.version }}
      release_label: ${{ steps.release_metadata.outputs.release_label }}
      archive_name: ${{ steps.release_metadata.outputs.archive_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the public team distribution channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          HMB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:HMB_REPOSITORY_PRIVATE -ne "false") {
            throw "HMB_GP_Production main must remain public for team update discovery."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned widget browser-test runtime
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false "playwright@1.62.1"
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned browser-test runtime." }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Could not install the browser-test Chromium." }
          $browser = node -p "require('playwright').chromium.executablePath()"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$browser")) { throw "Browser-test Chromium is unavailable." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_IMAGE_ASSET_TEST_BROWSER=$browser"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_IMAGE_ASSET_REQUIRE_BROWSER=1"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_COLOR_LUT_TEST_BROWSER=$browser"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_WIDGET_TEST_BROWSER=$browser"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_PROMPT_TEST_BROWSER=$browser"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_PICKER_TEST_BROWSER=$browser"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_PICKER_REQUIRE_BROWSER=1"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_SEEDANCE_TEST_BROWSER=$browser"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_SEEDANCE_REQUIRE_BROWSER=1"
      - name: Resolve validated release metadata
        id: release_metadata
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the package version from pyproject.toml."
          }
          $releaseLabel = python -c "from tools.package_runtime_release import RELEASE_LABEL; print(RELEASE_LABEL)"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the approved release label from the package builder."
          }
          $version = "$version".Trim()
          $releaseLabel = "$releaseLabel".Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Unsafe or unsupported package version: $version"
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = [int]$Matches[3]
          $expectedReleaseLabel = "v${major}.${minor}.$($patch.ToString('D2'))"
          if ($releaseLabel -cne $expectedReleaseLabel) {
            throw "Release label $releaseLabel does not match technical version $version; expected $expectedReleaseLabel."
          }
          $archiveName = "HMB_GP_Production_${releaseLabel}_Runtime.zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "release_label=$releaseLabel"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "archive_name=$archiveName"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_PACKAGE_VERSION=$version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_RELEASE_LABEL=$releaseLabel"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_RUNTIME_ARCHIVE=$archiveName"
      - name: Reject private or generated tracked content
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $approvedAgentRuntimeMembers = @(
            'resources/agent/superwings12/hmb_agent_core.dat',
            'resources/agent/Dinoster5/project.json',
            'resources/agent/Katuri8/project.json',
            'resources/agent/superwings12/project.json'
          )
          $forbidden = @($tracked | Where-Object {
            if ($approvedAgentRuntimeMembers -ccontains $_) { return $false }
            $_ -match '(^|/)(\.tmp|\.venv(?:-tos)?|backups|dist|GriptapeNodes|resources/agent|resources/policy|policies?)/' -or
            $_ -match '(^|/)hmb_agent_core\.dat$' -or
            $_ -match '(?i)(^|/)HMB_Agent_Polic(?:y|ies)[^/]*\.(txt|tex|md)$' -or
            $_ -match '(policy|policies).*(?:_ko(?:\.|$)|korean)' -or
            $_ -match '(^|/)\.env($|\.)' -or
            $_ -match '(^|/)(credentials|secrets)[^/]*\.json$' -or
            $_ -match '(^|/)(id_rsa|id_ed25519)[^/]*$' -or
            $_ -match '\.(dat|jwk|key|p12|pfx|secret|token|zip|pem)$'
          })
          if ($forbidden.Count -ne 0) {
            throw "Forbidden private/generated tracked paths: $($forbidden -join ', ')"
          }
      - name: Install pinned direct and audit dependencies
        run: python -m pip install "Pillow==12.3.0" "imageio-ffmpeg==0.6.0" "httpx==0.28.1" "packaging==26.3"
      - name: Install pinned media probe for real stream-copy regressions
        shell: pwsh
        run: |
          # imageio-ffmpeg supplies FFmpeg, but not the FFprobe stream metadata
          # required to test lossless stream copy without mocking the media tool.
          # FFmpeg's download page lists Gyan's Windows builds. Pin both the
          # release asset and its SHA256 so a package-feed outage cannot bypass
          # or prevent the actual media checks.
          $mediaRoot = Join-Path $env:RUNNER_TEMP 'hmb-ffmpeg-8.1.1'
          $archive = Join-Path $env:RUNNER_TEMP 'hmb-ffmpeg-8.1.1-essentials.zip'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-essentials_build.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 3
          $expected = '6f58ce889f59c311410f7d2b18895b33c03456463486f3b1ebc93d97a0f54541'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
            throw 'The pinned CI media archive failed its SHA256 check.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $mediaRoot -Force
          $bin = Join-Path $mediaRoot 'ffmpeg-8.1.1-essentials_build/bin'
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'ffprobe.exe')) -or
              -not (Test-Path -LiteralPath (Join-Path $bin 'ffmpeg.exe'))) {
            throw 'The pinned CI media tools are missing.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Value $bin
          $env:PATH = "$bin;$env:PATH"
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "FFprobe is unavailable in the CI PATH." }
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_COLOR_LUT_TEST_FFMPEG=$ffmpeg"
      - name: Require complete regression registration
        shell: pwsh
        run: python tools/audit_regression_coverage.py --check
      - name: Prepare the pinned stock editor fixture for native UI checks
        shell: pwsh
        run: |
          # Use the upstream wheel as data only. Do not install, execute or
          # redistribute the stock editor in this repository or Runtime ZIP.
          $wheel = Join-Path $env:RUNNER_TEMP 'griptape_nodes_editor_dist-0.128.1-py3-none-any.whl'
          $url = 'https://files.pythonhosted.org/packages/d4/a7/d7346fffd0a1c77bb73e06a1480484506384171d8a77fbe1dfba1509ab0b/griptape_nodes_editor_dist-0.128.1-py3-none-any.whl'
          Invoke-WebRequest -Uri $url -OutFile $wheel -MaximumRetryCount 2 -RetryIntervalSec 3
          $expected = '3214157ea071a0ce94f159c4a51e5557cd43035a3ed9e6c6d8e12eef009f10b0'
          if ((Get-FileHash -LiteralPath $wheel -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
            throw 'The pinned stock editor wheel failed its SHA256 check.'
          }
          $fixture = Join-Path $PWD 'reports/color-lut-native-header-20261023/index-DEZU41rc.original.js'
          python -c "import hashlib,pathlib,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); data=z.read('griptape_nodes_editor_dist/editor/assets/index-DEZU41rc.js'); assert len(data)==12111101; assert hashlib.sha256(data).hexdigest()=='1a0429b88c6b8dd1c7e6e053836d03f734a4d6453f8886e0693527c7498909e2'; p=pathlib.Path(sys.argv[2]); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)" $wheel $fixture
          if ($LASTEXITCODE -ne 0) { throw 'The supported stock editor fixture is unavailable or changed.' }
          $cssFixture = Join-Path $PWD 'reports/color-lut-native-header-20261023/index-C-Si1lvW.original.css'
          python -c "import hashlib,pathlib,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); data=z.read('griptape_nodes_editor_dist/editor/assets/index-C-Si1lvW.css'); assert len(data)==978519; assert hashlib.sha256(data).hexdigest()=='0cdeb2a95665f7539e7f296a04b79ac44c5c3ff9772f2b88a4c050e4653a5032'; pathlib.Path(sys.argv[2]).write_bytes(data)" $wheel $cssFixture
          if ($LASTEXITCODE -ne 0) { throw 'The supported stock editor CSS fixture is unavailable or changed.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_NATIVE_HEADER_EDITOR_SOURCE=$fixture"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_NATIVE_HEADER_EDITOR_CSS=$cssFixture"
          $python = python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$python")) { throw 'The regression Python interpreter is unavailable.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_REGRESSION_PYTHON=$python"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_NATIVE_HEADER_PYTHON=$python"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_IMAGE_BASH_WORKSPACE_PYTHON=$python"
      - name: JavaScript widget regressions with required browser coverage
        shell: pwsh
        run: python tools/audit_regression_coverage.py --run javascript --report "${{ runner.temp }}/hmb-coverage/javascript.json"
      - name: Python release regressions with coverage receipts
        shell: pwsh
        env:
          HMB_IMAGE_PROJECTS_ROOT: ${{ github.workspace }}
        run: python tools/audit_regression_coverage.py --run python --report "${{ runner.temp }}/hmb-coverage/python.json"
      - name: Verify current engine Pillow major without changing the minimum-version suite
        shell: pwsh
        run: |
          # The full suite above exercises the oldest supported Pillow 12.3.
          # This separate CI process also tests the engine's Pillow 13 codec,
          # bounded reference resize, atomic save and corrupt-image behavior.
          python -m pip install "Pillow==13.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned Pillow 13 audit runtime." }
          python resources/tests/HMB_Pillow_Host_Compatibility_Regression.py
          if ($LASTEXITCODE -ne 0) { throw "Pillow 13 host compatibility regression failed." }
          python resources/tests/HMB_Seedance_Image_Pixel_Limits_Regression.py
          if ($LASTEXITCODE -ne 0) { throw "Pillow 13 image pixel-limit regression failed." }
      - name: Upload pass and unexecuted coverage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmb-regression-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/hmb-coverage/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize actual regression coverage
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}/hmb-coverage" -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object {
            $coverage = Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### HMB $($coverage.language) coverage"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Passed: $($coverage.summary.passed); failed: $($coverage.summary.failed); not run: $($coverage.summary.not_run). Native SDK/DCC coverage is counted only when actually executed."
          }
      - name: Runtime package static syntax audit
        shell: pwsh
        run: |
          # Verify the bundled signed DAT and runtime package; policy source
          # and review documents are never part of the team distribution.
          python -m py_compile tools/package_runtime_release.py
          python tools/package_runtime_release.py --check
          $artifact = Join-Path $env:RUNNER_TEMP $env:HMB_RUNTIME_ARCHIVE
          python tools/package_runtime_release.py --output $artifact
          python tools/package_runtime_release.py --check-output --output $artifact
      - name: Require tested even-to-odd runtime parity
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: python tools/package_runtime_release.py --check-parity-proof .github/hmb-release-parity.json
      - name: Prepare tagged team distribution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:HMB_PACKAGE_VERSION
          $releaseLabel = $env:HMB_RELEASE_LABEL
          if ($env:GITHUB_REF_NAME -cne $releaseLabel) {
            throw "Release tag $env:GITHUB_REF_NAME does not match approved label $releaseLabel."
          }
          $versionParts = $version.Split('.')
          if ($versionParts.Count -ne 3 -or ([int]$versionParts[2] % 2) -eq 0) {
            throw "Even technical patch version $version is local-test-only. Team releases require an odd technical patch version."
          }
          $artifact = Join-Path $env:RUNNER_TEMP $env:HMB_RUNTIME_ARCHIVE
          $checksum = "{0} *{1}" -f `
            (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant(), `
            (Split-Path -Leaf $artifact)
          Set-Content -LiteralPath "$artifact.sha256" -Value $checksum -Encoding ascii -NoNewline
      - name: Upload audited tagged team distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hmb-team-release-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/${{ steps.release_metadata.outputs.archive_name }}
            ${{ runner.temp }}/${{ steps.release_metadata.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-team-release:
    needs: windows-release-audit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download audited team distribution
        uses: actions/download-artifact@v4
        with:
          name: hmb-team-release-${{ github.ref_name }}
          path: release
      - name: Publish GitHub team release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HMB_PACKAGE_VERSION: ${{ needs.windows-release-audit.outputs.package_version }}
          HMB_RELEASE_LABEL: ${{ needs.windows-release-audit.outputs.release_label }}
          HMB_RUNTIME_ARCHIVE: ${{ needs.windows-release-audit.outputs.archive_name }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $version = "$env:HMB_PACKAGE_VERSION".Trim()
          $releaseLabel = "$env:HMB_RELEASE_LABEL".Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Unsafe or unsupported package version: $version"
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = [int]$Matches[3]
          $expectedReleaseLabel = "v${major}.${minor}.$($patch.ToString('D2'))"
          if ($releaseLabel -cne $expectedReleaseLabel -or $env:GITHUB_REF_NAME -cne $releaseLabel) {
            throw "Published tag, release label, and technical version are inconsistent."
          }
          $expectedArchiveName = "HMB_GP_Production_${releaseLabel}_Runtime.zip"
          if ($env:HMB_RUNTIME_ARCHIVE -ne $expectedArchiveName) {
            throw "Audited release metadata is inconsistent."
          }
          $archive = Join-Path $PWD "release/$expectedArchiveName"
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive) -or -not (Test-Path -LiteralPath $checksum)) {
            throw "Audited release assets are missing."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "HMB_GP_Production_${releaseLabel}_release_notes.md"
          @(
            "## HMB GP Production $releaseLabel",
            "",
            "- Prevents the stock editor from optimistically removing HMB nodes after a Git-only update. Until the complete native integration is installed, canvas deletion is stopped with an explicit installation notice; input editing and internal asset/Shot actions remain available.",
            "- Keeps the engine deletion gate active across library unload/reload while HMB nodes remain. Native deletion requires the current protection readiness contract; unsupported SDK APIs and initialization failures are reported instead of silently disabling protection.",
            "- Requires griptape-nodes 0.101.3 or newer plus the actual pre-dispatch APIs. The installer validates SDK metadata and source definitions before moving files, verifies them again before applying, and upgrades either reviewed previous native patch atomically.",
            "- Reads image projects only from projects/<project>/Ai_Ct_image, including superwings12 and Katuri8. Known old saved addresses are replaced in memory; retired folders are never read as compatibility or recovery locations. Existing Shot and bundle identities remain intact.",
            "- Adds HMB ImageBash as a local image workspace with remote ImageAsset selection, native image output, local save and durable workspace restoration. Existing production Shot slots remain separate.",
            "- Applies the unified rounded native header to HMB VideoPicker, HMB Agent, HMB ImageAsset Library, HMBPrompt, HMB ImageBash, Color LUT and Finish Look while retaining their existing palettes, controls and connections.",
            "- Uses the dedicated fold control for the rounded Soft Link capsule and Double Click to Unlock restoration. Other header double-clicks select compact mode only where supported. Capsule restore, edge resizing and popup hit areas retain native port behavior.",
            "- Adds common connected-node deletion protection to every registered HMB tool, including future types. Trash, Delete, context-menu, batch and engine paths refuse removal while a real wire or accepted remote binding remains and identify the connected targets.",
            "- Adds Connection Management to inspect, disconnect and reconnect exact original relationships without deleting Shot inputs, prompts, settings, media, results or Task IDs. Saved disconnect fences survive reopening; missing or replaced owners are never silently substituted.",
            "- Reduces unnecessary Agent and Prompt page calculations, repeated image resolution, idle acknowledgements and duplicate layout work. All five Shot inputs, bindings, model settings and results retain independent ownership during switching and execution.",
            "- Restores CGT account and installed-SDK integration with pinned server trust, own-task lookup and a project-plus-episode selector. Episode filtering reuses the received catalog without clearing selected Shots.",
            "- Restores explicit parent and child Shot assignment, including a child that also heads a separate bundle. Cycles are rejected; all five Shot UUIDs and individual executions remain independent. Bundle names include direct children and use the available name area without moving the fixed selection note.",
            "- Preserves legacy standalone Prompt and Agent authoring, saved model identities, existing Task IDs, per-Shot outputs and recovery snapshots. The workflow serialization compatibility layer prevents temporary-list identity collisions without editing the Griptape SDK.",
            "- Keeps user-authored schemas and structured Agent results containing shot_uuid fields separate from actual binding metadata during legacy reopen. Detached Shot stores and ambiguous original ownership still require their existing explicit recovery checks.",
            "- Makes Color LUT Web Upload transfer the original immediately. The wider final-output button exports the graded result before uploading. Bound uploads keep the verified project and generation-time Shot name even if the current library bundle is renamed; manual uploads use an authenticated project or personal My Box and the source filename.",
            "- Includes the native editor patch in the Runtime ZIP installer. It checks the supported editor version and exact bundle hashes before replacement, skips an identical patch and rolls library and editor changes back together on failure. Unknown editor builds are preserved and rejected.",
            "- Preserves personal local image generation with Nano Banana Pro and Nano Banana 2, model-specific options, exact provider IDs and existing Task recovery. Provider keys remain on the Broker; generated images are not published to project review lists.",
            "- Preserves original local image and MOV/MP4 previews, My Box result retrieval, mode-preserving web rerenders and ambiguous-submission protection. Release tests never submit replacement paid generations.",
            "- Keeps the durable shared Broker address, authenticated project discovery, Only mode, explicit Draft settings, isolated optional TOS environment and bundled signed Agent runtime. Matching Broker APIs and permissions are required for web review and publication; this client package does not deploy the server.",
            "- Includes registered Python, JavaScript, browser, installed-SDK and DCC checks. Coverage receipts distinguish actual executions, historical evidence and not-run items; offline fixtures do not establish live provider or animation quality.",
            "- Includes SHA256 integrity manifests and verified local-to-team functional parity. Private policy sources, signing material, credentials, test data and local reports are excluded from the distribution.",
            "",
            "For the complete native UI, save your workflow, fully close Griptape, extract the Runtime ZIP and run Install_HMB_GP_Production.ps1. Git Update/Override updates library code only and does not install the native editor integration. The installer preserves existing workflows, settings and outputs and records recovery data. Fully restart Griptape after installation. Fresh optional TOS setup can use -PrepareTosRuntime."
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8
          $releaseLookup = @(gh api "repos/$repository/releases/tags/$env:GITHUB_REF_NAME" --include --silent 2>&1)
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $archive $checksum --clobber --repo $repository
            if ($LASTEXITCODE -ne 0) { throw "Could not upload the audited release assets." }
            gh release edit $env:GITHUB_REF_NAME `
              --title "HMB GP Production $env:GITHUB_REF_NAME" `
              --notes-file $notesPath `
              --latest `
              --repo $repository
            if ($LASTEXITCODE -ne 0) { throw "Could not update the release metadata." }
          } elseif (($releaseLookup -join "`n") -match '(?m)^HTTP/\S+\s+404(?:\s|$)') {
            gh release create $env:GITHUB_REF_NAME $archive $checksum `
              --verify-tag `
              --title "HMB GP Production $env:GITHUB_REF_NAME" `
              --notes-file $notesPath `
              --latest `
              --repo $repository
            if ($LASTEXITCODE -ne 0) { throw "Could not create the audited team release." }
          } else {
            throw "Could not determine whether the release exists (GitHub CLI exit $releaseLookupExitCode); publication stopped."
          }
