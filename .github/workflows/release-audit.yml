name: release-audit

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-release-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.release_metadata.outputs.version }}
      release_label: ${{ steps.release_metadata.outputs.release_label }}
      archive_name: ${{ steps.release_metadata.outputs.archive_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the public team distribution channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          HMB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:HMB_REPOSITORY_PRIVATE -ne "false") {
            throw "HMB_GP_Production main must remain public for team update discovery."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve validated release metadata
        id: release_metadata
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the package version from pyproject.toml."
          }
          $releaseLabel = python -c "from tools.package_runtime_release import RELEASE_LABEL; print(RELEASE_LABEL)"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the approved release label from the package builder."
          }
          $version = "$version".Trim()
          $releaseLabel = "$releaseLabel".Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Unsafe or unsupported package version: $version"
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = [int]$Matches[3]
          $expectedReleaseLabel = "v${major}.${minor}.$($patch.ToString('D2'))"
          if ($releaseLabel -cne $expectedReleaseLabel) {
            throw "Release label $releaseLabel does not match technical version $version; expected $expectedReleaseLabel."
          }
          $archiveName = "HMB_GP_Production_${releaseLabel}_Runtime.zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "release_label=$releaseLabel"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "archive_name=$archiveName"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_PACKAGE_VERSION=$version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_RELEASE_LABEL=$releaseLabel"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "HMB_RUNTIME_ARCHIVE=$archiveName"
      - name: Reject private or generated tracked content
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $forbidden = @($tracked | Where-Object {
            if ($_ -eq 'resources/agent/hmb_agent_core.dat') { return $false }
            $_ -match '(^|/)(\.tmp|\.venv|backups|dist|GriptapeNodes|resources/agent|resources/policy|policies?)/' -or
            $_ -match '(^|/)hmb_agent_core\.dat$' -or
            $_ -match '(policy|policies).*(?:_ko(?:\.|$)|korean)' -or
            $_ -match '(^|/)\.env($|\.)' -or
            $_ -match '(^|/)(credentials|secrets)[^/]*\.json$' -or
            $_ -match '(^|/)(id_rsa|id_ed25519)[^/]*$' -or
            $_ -match '\.(dat|jwk|key|p12|pfx|secret|token|zip|pem)$'
          })
          if ($forbidden.Count -ne 0) {
            throw "Forbidden private/generated tracked paths: $($forbidden -join ', ')"
          }
      - name: Install pinned direct dependencies
        run: python -m pip install "Pillow==12.3.0" "imageio-ffmpeg==0.6.0" "httpx==0.28.1" "tos==2.9.2"
      - name: Install pinned media probe for real stream-copy regressions
        shell: pwsh
        run: |
          # imageio-ffmpeg supplies FFmpeg, but not the FFprobe stream metadata
          # required to test lossless stream copy without mocking the media tool.
          choco install ffmpeg --version=8.1.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Could not install the CI media tools." }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "FFprobe is unavailable in the CI PATH." }
      - name: Python release regressions
        shell: pwsh
        env:
          HMB_IMAGE_PROJECTS_ROOT: ${{ github.workspace }}
        run: |
          # Public CI verifies the exact bundled signed DAT and package boundary.
          $tests = @(
            "HMB_Color_LUT_Engine_Regression.py",
            "HMB_Color_LUT_Node_Regression.py",
            "HMB_Color_LUT_Routing_Regression.py",
            "HMB_Prompt_Surface_2D_Regression.py",
            "HMB_Agent_Failure_Diagnostic_Regression.py",
            "HMB_Seedance_Sidecar_API_Regression.py",
            "HMB_Finish_Look_Regression.py",
            "HMB_Finish_Look_Steps_Regression.py",
            "HMB_Picker_Video_Tools_Regression.py",
            "HMB_Picker_Video_Tools_Source_Lifecycle_Regression.py",
            "HMB_Picker_Tools_Output_Path_Regression.py",
            "HMB_Picker_Concatenate_Result_Shot_Regression.py",
            "HMB_Picker_Edit_Delete_RoundTrip_Regression.py",
            "HMB_VideoPicker_Shared_Maya_Async_Regression.py",
            "HMB_VideoPicker_Shared_Maya_RoundTrip_Regression.py",
            "HMB_Video_Tools_Engine_Regression.py",
            "HMB_Seedance_Gateway_Recovery_Regression.py",
            "HMB_Seedance_Submission_Identity_Regression.py",
              "HMB_Seedance_Native_Save_Regression.py",
            "HMB_Seedance_Reset_Delete_Fresh_State_Regression.py",
            "HMB_Seedance_Discarded_Workflow_Recovery_Regression.py",
            "HMB_Four_Library_Flow_Regression.py",
            "HMB_Three_Library_Flow_Regression.py",
            "HMB_Agent_Policy_Integration_Regression.py",
            "HMB_Agent_Result_Skip_Regression.py",
            "HMB_Look_Attribute_Scope_Regression.py",
            "HMB_Data_Only_Prompt_Security_Regression.py",
            "HMB_Agent_Paired_Prompt_Snapshot_Regression.py",
            "HMB_FX_Timing_Range_Contract_Regression.py",
            "HMB_Frame_Range_Regression.py",
            "HMB_Optional_Frame_Range_Contract_Regression.py",
            "HMB_Prompt_Free_Frame_Range_Contract_Regression.py",
            "HMB_Four_Library_Generator_Neutrality_Regression.py",
            "HMB_Real_Standard_Agent_Boundary_Regression.py",
            "HMB_Server_Policy_Boundary_Regression.py",
            "HMB_Signed_Policy_Hot_Update_Regression.py",
            "HMB_Public_Release_Security_Regression.py",
            "HMB_State_Normalization_Property_Regression.py",
            "HMB_Image_Asset_Import_Order_Regression.py",
            "HMB_Image_Asset_Project_Root_Relocation_Regression.py",
            "HMB_Image_Asset_Staged_Loading_Regression.py",
            "HMB_Image_Asset_Shared_Catalog_Cache_Regression.py",
            "HMB_Image_Asset_Resolved_Selection_Regression.py",
            "HMB_Prompt_No_Loss_Connection_Regression.py",
            "HMB_Image_Asset_Registration_Regression.py",
            "HMB_Image_Asset_Background_Mutation_Regression.py",
            "HMB_Image_Asset_Server_Sharing_Regression.py",
            "HMB_Image_Asset_Process_Lock_Regression.py",
            "HMB_Image_Asset_State_Echo_Regression.py",
            "HMB_Image_Taxonomy_Regression.py",
            "HMB_Cutout_Transparency_Regression.py",
            "HMB_Depth_Companion_Regression.py",
            "HMB_Picker_Depth_Range_Mesh_Regression.py",
            "HMB_VideoPicker_Reliability_Regression.py",
            "HMB_Depth_Visual_Contract_Regression.py",
            "HMB_Maya_Runner_Performance_Regression.py",
            "HMB_Mouth_Card_Inner_Patch_Regression.py",
            "HMB_Motion_Guide_Regression.py",
            "HMB_Prompt_Field_Authority_Regression.py",
            "HMB_Prompt_Output_Coalescing_Regression.py",
            "HMB_Prompt_Source_Reconcile_NoOp_Regression.py",
            "HMB_Prompt_Revision_Axis_Regression.py",
            "HMB_Prompt_Picker_Disconnect_Restore_Regression.py",
            "HMB_Prompt_Public_Prompt_Boundary_Regression.py",
            "HMB_Picker_Prompt_Agent_Live_Host_Regression.py",
            "HMB_Picker_State_Compaction_Regression.py",
            "HMB_VideoPicker_Media_Availability_Regression.py",
            "HMB_VideoPicker_Native_Size_Migration_Regression.py",
            "HMB_VideoPicker_Python_Geometry_Hydration_Regression.py",
            "HMB_VideoPicker_High_Quality_Original_Regression.py",
            "HMB_VideoPicker_Original_Lambert_Override_Regression.py",
            "HMB_VideoPicker_Maya_Shot_Authoring_Regression.py",
            "HMB_VideoPicker_Save_Reload_Regression.py",
            "HMB_VideoPicker_Real_Saved_Workflow_Replay_Regression.py",
            "HMB_VideoPicker_Five_Shot_Recursive_Save_Reload_Regression.py",
            "HMB_VideoPicker_Five_Shot_Recursive_RoundTrip_Regression.py",
            "HMB_Runtime_Resource_Cleanliness_Regression.py",
            "HMB_Typed_Auxiliary_Video_Slots_Regression.py",
            "HMB_Video_Taxonomy_Regression.py",
            "HMB_Agent_Authenticated_Broker_Regression.py",
            "HMB_Agent_Cloud_Nonstreaming_Regression.py",
            "HMB_Agent_Policy_Collision_Retry_Regression.py",
            "HMB_Agent_English_Video_Progression_Regression.py",
            "HMB_Agent_Generator_Semantic_Integrity_Regression.py",
            "HMB_Policy_Identity_Distinctiveness_Regression.py",
            "HMB_Agent_Runtime_Prompt_UI_Isolation_Regression.py",
            "HMB_Agent_Shot_Binding_Regression.py",
            "HMB_Seedance_MP4_Verifier_Portability_Regression.py",
            "HMB_Seedance_Crash_Reopen_Recovery_Regression.py",
            "HMB_Seedance_Direct_Shot_Source_Regression.py",
            "HMB_Seedance_Five_Node_Full_Lifecycle_Concurrency_Regression.py",
            "HMB_Seedance_Five_Shot_Submission_Concurrency_Regression.py",
            "HMB_Seedance_Media_Preflight_Regression.py",
            "HMB_Seedance_Refresh_Command_Regression.py",
            "HMB_Seedance_Retrieve_UI_Nonblocking_Regression.py",
            "HMB_Five_Library_Shot_Routing_Regression.py",
            "HMB_Shot_Picker_Dict_Port_Migration_Regression.py",
            "HMB_Shot_Routing_Flow_Isolation_Regression.py",
            "HMB_Shot_Routing_Pass_Cache_Regression.py",
            "HMB_Shot_Routing_Reconcile_Acknowledgement_Regression.py",
            "HMB_Singleton_Reset_Lifecycle_Regression.py",
            "HMB_Singleton_Reset_Media_Preservation_Regression.py",
            "HMB_VideoPicker_Asset_Catalog_Regression.py",
            "HMB_VideoPicker_Five_Shot_Deletion_Permutation_Regression.py",
            "HMB_VideoPicker_Five_Shot_Output_Cohesion_Regression.py",
            "HMB_VideoPicker_Live_Output_Regression.py",
            "HMB_VideoPicker_No_Loss_State_Regression.py",
            "HMB_VideoPicker_Publisher_Replacement_Regression.py",
            "HMB_VideoPicker_Server_Media_Reload_Regression.py",
            "HMB_VideoPicker_Snapshot_History_Regression.py"
          )
          foreach ($test in $tests) {
            python (Join-Path "resources/tests" $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: JavaScript widget regressions
        shell: pwsh
        run: |
          Get-ChildItem resources/tests -Filter "*.mjs" | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Runtime package static syntax audit
        shell: pwsh
        run: |
          # Verify the bundled signed DAT and runtime package; policy source
          # and review documents are never part of the team distribution.
          python -m py_compile tools/package_runtime_release.py
          python tools/package_runtime_release.py --check
          $artifact = Join-Path $env:RUNNER_TEMP $env:HMB_RUNTIME_ARCHIVE
          python tools/package_runtime_release.py --output $artifact
          python tools/package_runtime_release.py --check-output --output $artifact
      - name: Require tested even-to-odd runtime parity
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: python tools/package_runtime_release.py --check-parity-proof .github/hmb-release-parity.json
      - name: Prepare tagged team distribution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:HMB_PACKAGE_VERSION
          $releaseLabel = $env:HMB_RELEASE_LABEL
          if ($env:GITHUB_REF_NAME -cne $releaseLabel) {
            throw "Release tag $env:GITHUB_REF_NAME does not match approved label $releaseLabel."
          }
          $versionParts = $version.Split('.')
          if ($versionParts.Count -ne 3 -or ([int]$versionParts[2] % 2) -eq 0) {
            throw "Even technical patch version $version is local-test-only. Team releases require an odd technical patch version."
          }
          $artifact = Join-Path $env:RUNNER_TEMP $env:HMB_RUNTIME_ARCHIVE
          $checksum = "{0} *{1}" -f `
            (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant(), `
            (Split-Path -Leaf $artifact)
          Set-Content -LiteralPath "$artifact.sha256" -Value $checksum -Encoding ascii -NoNewline
      - name: Upload audited tagged team distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hmb-team-release-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/${{ steps.release_metadata.outputs.archive_name }}
            ${{ runner.temp }}/${{ steps.release_metadata.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-team-release:
    needs: windows-release-audit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download audited team distribution
        uses: actions/download-artifact@v4
        with:
          name: hmb-team-release-${{ github.ref_name }}
          path: release
      - name: Publish GitHub team release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HMB_PACKAGE_VERSION: ${{ needs.windows-release-audit.outputs.package_version }}
          HMB_RELEASE_LABEL: ${{ needs.windows-release-audit.outputs.release_label }}
          HMB_RUNTIME_ARCHIVE: ${{ needs.windows-release-audit.outputs.archive_name }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $version = "$env:HMB_PACKAGE_VERSION".Trim()
          $releaseLabel = "$env:HMB_RELEASE_LABEL".Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Unsafe or unsupported package version: $version"
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = [int]$Matches[3]
          $expectedReleaseLabel = "v${major}.${minor}.$($patch.ToString('D2'))"
          if ($releaseLabel -cne $expectedReleaseLabel -or $env:GITHUB_REF_NAME -cne $releaseLabel) {
            throw "Published tag, release label, and technical version are inconsistent."
          }
          $expectedArchiveName = "HMB_GP_Production_${releaseLabel}_Runtime.zip"
          if ($env:HMB_RUNTIME_ARCHIVE -ne $expectedArchiveName) {
            throw "Audited release metadata is inconsistent."
          }
          $archive = Join-Path $PWD "release/$expectedArchiveName"
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive) -or -not (Test-Path -LiteralPath $checksum)) {
            throw "Audited release assets are missing."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "HMB_GP_Production_${releaseLabel}_release_notes.md"
          @(
            "## HMB GP Production $releaseLabel",
            "",
            "- Reopening a workflow restores the saved Generator task and exact saved video; discarded newer local recovery journals never replace that snapshot or attach a different render to it. Explicit Refresh keeps the saved/live task ID.",
            "- Moves the ImageAsset production catalog to //192.168.200.19/v/projects/Ai_Ct_image and automatically rebases saved paths under the retired share, preserving Shot selections, asset identities, ordering, and other custom roots.",
            "- Adds Picker Near (unchanged default), Middle, and Whole-shot Far Depth ranges, shown only when Depth is enabled, plus expandable per-mesh color assignment and shared eye pass-through controls.",
            "- Fixes Picker project-media publication for current and legacy Griptape sidecar APIs, passing the active Engine without retrying writes or changing Maya Depth calculation.",
            "- Includes HMB Color LUT with Shot-bound completed Generator video, shared ImageAsset project selection, named presets, automatic LUT archival, and twelve-step controls.",
            "- Includes optional per-image 2D Surface guidance (disabled by default), Layout Reference motion guidance, and Agent failure isolation so other Shot branches continue.",
            "- Includes the current bundled signed Agent DAT; policy source files and server configuration are not modified.",
            "- Keeps HMBAgentLibrary model declarations in exact parity with the installed Standard Agent surface, preserving host permission and accounting without adding an HMB-specific model allowlist.",
            "- Keeps each Look Reference Target editable per shot for active named targets or explicit Global Look; Camera / Composition is available only as a Look Reference Sub Type and never as a Target for Character, Prop, or Environment rows.",
            "- Prefers Griptape Cloud HTTPS for local/Base64 images and local videos only when authentication and an accessible bucket are ready; otherwise images retain bounded Base64 and videos retain public HTTPS, asset://, or configured TOS fallbacks.",
            "- Recomputes VideoPicker Generate availability immediately for Original, Mask, Depth, and Motion Guide output choices while preserving command locks.",
            "- Renders Original Playblast with temporary per-source Maya Lambert materials, preserving compatible texture identity, safely falling back per unsupported material, and restoring every authored shading assignment after capture so Redshift is not required on team workstations.",
            "- Enlarges only the Object pattern swatch visual by 10% while preserving its 20px hitbox, palette layout, marker identity, and Maya render behavior.",
            "- Loads ImageAsset thumbnails in staged batches while preserving shot selection, drag order, registration, and Agent routing contracts.",
            "- Adds independent Picker Concatenate and Video Crop tools with individual cross-Shot card dragging, ordered edit queues, and first-input source-folder output paths.",
            "- Concatenate captures the first input card's Shot at Run and adds the completed result there only on explicit request; Crop retains its own single input and work-Shot destination.",
            "- Includes Shot-bound Finish Look and preserves exact Shot routing and safe Seedance gateway/retrieval recovery.",
            "- Replaces all 22 Finish Look numeric fields with localized discrete step sliders; dragging previews locally and commits on release while preserving Shot binding and remote locks.",
            "- Preserves ImageAsset compact layout when native image inputs expand, supports compact card reordering, and keeps shared control fonts consistent across all six libraries.",
            "- Applies ImageAsset, Picker, and Prompt edits immediately in the UI, coalesces background state publication, and flushes the newest Shot and inputs before execution.",
            "- Keeps Seedance recovery tied to the exact submitted task and retains the same request ID and temporary uploads when a create response is incomplete; uncertain submissions never trigger an automatic replacement render.",
            "- Includes the manifest-verified runtime installer and exact SHA256 checksum.",
            "",
            "Close Griptape completely before running the included installer."
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release view $env:GITHUB_REF_NAME --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $archive $checksum --clobber --repo $repository
            gh release edit $env:GITHUB_REF_NAME `
              --title "HMB GP Production $env:GITHUB_REF_NAME" `
              --notes-file $notesPath `
              --latest `
              --repo $repository
          } else {
            gh release create $env:GITHUB_REF_NAME $archive $checksum `
              --verify-tag `
              --title "HMB GP Production $env:GITHUB_REF_NAME" `
              --notes-file $notesPath `
              --latest `
              --repo $repository
          }
